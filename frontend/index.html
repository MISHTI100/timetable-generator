<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>College Timetable Generator</title>
<style>
  :root{
    --ink:#1b2430;
    --paper:#f6f4ee;
    --rule:#d8d2c2;
    --accent:#3a6b5c;
    --accent-2:#b5502e;
    --slot-bg:#ffffff;
    font-family: "Iowan Old Style","Georgia",serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    padding:32px 24px 80px;
  }
  h1{
    font-size:28px;
    letter-spacing:.3px;
    margin:0 0 2px;
  }
  .sub{
    color:#5a6270;
    font-family:"Courier New",monospace;
    font-size:13px;
    margin-bottom:28px;
    text-transform:uppercase;
    letter-spacing:1.5px;
  }
  .grid{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:28px;
    max-width:1200px;
    margin:0 auto;
  }
  .panel{
    background:var(--slot-bg);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:18px 20px;
    margin-bottom:20px;
  }
  .panel h2{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0 0 12px;
    color:var(--accent);
    border-bottom:1px solid var(--rule);
    padding-bottom:8px;
    font-family:"Courier New",monospace;
  }
  label{
    display:block;
    font-size:12px;
    color:#5a6270;
    margin:10px 0 4px;
    font-family:"Courier New",monospace;
  }
  input, select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--rule);
    border-radius:3px;
    font-size:14px;
    font-family: inherit;
    background:#fdfcf9;
  }
  button{
    margin-top:14px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:3px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    letter-spacing:.4px;
    cursor:pointer;
    font-family:"Courier New",monospace;
    text-transform:uppercase;
  }
  button:hover{ filter:brightness(1.08); }
  button.generate{
    background:var(--accent-2);
    font-size:15px;
    padding:14px;
  }
  ul.list{
    list-style:none; margin:8px 0 0; padding:0;
    font-size:13px; color:#3a4250;
  }
  ul.list li{ padding:3px 0; border-bottom:1px dashed var(--rule); }

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--slot-bg);
    border:1px solid var(--rule);
  }
  th, td{
    border:1px solid var(--rule);
    padding:8px;
    font-size:12px;
    text-align:left;
    vertical-align:top;
  }
  th{
    background:var(--ink);
    color:var(--paper);
    font-family:"Courier New",monospace;
    text-transform:uppercase;
    letter-spacing:.5px;
    font-size:11px;
  }
  .cell-subject{ font-weight:bold; color:var(--accent); }
  .cell-meta{ color:#6a7280; font-size:11px; }
  .msg{
    font-family:"Courier New",monospace;
    font-size:13px;
    padding:10px 12px;
    border-radius:3px;
    margin-bottom:14px;
  }
  .msg.error{ background:#fbe4e0; color:#8a2f19; border:1px solid #e4a493; }
  .msg.ok{ background:#e3ede7; color:#2b5544; border:1px solid #a9c9ba; }
  .section-tabs{ margin-bottom:14px; }
  .section-tabs button{
    display:inline-block; width:auto; margin:0 6px 0 0;
    background:#efece2; color:var(--ink); border:1px solid var(--rule);
    padding:6px 14px; font-size:12px;
  }
  .section-tabs button.active{ background:var(--accent); color:#fff; }
</style>
</head>
<body>

<h1>College Timetable Generator</h1>
<div class="sub">Backtracking CSP scheduler · FastAPI + SQLite</div>

<div class="grid">
  <!-- LEFT: data entry -->
  <div>
    <div class="panel">
      <h2>1. Teachers</h2>
      <label>Teacher name</label>
      <input id="teacherName" placeholder="e.g. Mr. Rao" />
      <button onclick="addTeacher()">Add teacher</button>
      <ul class="list" id="teacherList"></ul>
    </div>

    <div class="panel">
      <h2>2. Rooms</h2>
      <label>Room name</label>
      <input id="roomName" placeholder="e.g. LT-1" />
      <button onclick="addRoom()">Add room</button>
      <ul class="list" id="roomList"></ul>
    </div>

    <div class="panel">
      <h2>3. Sections</h2>
      <label>Section name</label>
      <input id="sectionName" placeholder="e.g. CSE-A" />
      <button onclick="addSection()">Add section</button>
      <ul class="list" id="sectionList"></ul>
    </div>

    <div class="panel">
      <h2>4. Subjects</h2>
      <label>Subject name</label>
      <input id="subjectName" placeholder="e.g. DBMS" />
      <label>Periods per week</label>
      <input id="subjectPeriods" type="number" min="1" max="10" value="3" />
      <label>Teacher</label>
      <select id="subjectTeacher"></select>
      <label>Section</label>
      <select id="subjectSection"></select>
      <button onclick="addSubject()">Add subject</button>
      <ul class="list" id="subjectList"></ul>
    </div>

    <div class="panel">
      <button class="generate" onclick="generateTimetable()">Generate Timetable</button>
    </div>
  </div>

  <!-- RIGHT: result -->
  <div>
    <div id="messages"></div>
    <div class="panel">
      <h2>Generated Timetable</h2>
      <div class="section-tabs" id="sectionTabs"></div>
      <div id="timetableView">
        <p style="color:#8a8f98; font-family:'Courier New',monospace; font-size:13px;">
          Add teachers, rooms, sections and subjects on the left, then click
          "Generate Timetable".
        </p>
      </div>
    </div>
  </div>
</div>

<script>
// ---- CHANGE THIS if your backend runs on a different port ----
const API = "http://localhost:8000";

let teachers = [], rooms = [], sections = [], subjects = [];
let lastTimetable = [];
let activeSection = null;

async function refreshAll(){
  teachers = await (await fetch(`${API}/teachers`)).json();
  rooms = await (await fetch(`${API}/rooms`)).json();
  sections = await (await fetch(`${API}/sections`)).json();
  subjects = await (await fetch(`${API}/subjects`)).json();
  renderLists();
}

function renderLists(){
  document.getElementById("teacherList").innerHTML =
    teachers.map(t => `<li>${t.name}</li>`).join("");
  document.getElementById("roomList").innerHTML =
    rooms.map(r => `<li>${r.name}</li>`).join("");
  document.getElementById("sectionList").innerHTML =
    sections.map(s => `<li>${s.name}</li>`).join("");
  document.getElementById("subjectList").innerHTML =
    subjects.map(s => `<li>${s.name} — ${s.periods_per_week}/wk</li>`).join("");

  const tSel = document.getElementById("subjectTeacher");
  tSel.innerHTML = teachers.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
  const sSel = document.getElementById("subjectSection");
  sSel.innerHTML = sections.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
}

function showMessage(text, type){
  document.getElementById("messages").innerHTML =
    `<div class="msg ${type}">${text}</div>`;
}

async function addTeacher(){
  const name = document.getElementById("teacherName").value.trim();
  if(!name) return;
  await fetch(`${API}/teachers`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name})});
  document.getElementById("teacherName").value = "";
  refreshAll();
}

async function addRoom(){
  const name = document.getElementById("roomName").value.trim();
  if(!name) return;
  await fetch(`${API}/rooms`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name})});
  document.getElementById("roomName").value = "";
  refreshAll();
}

async function addSection(){
  const name = document.getElementById("sectionName").value.trim();
  if(!name) return;
  await fetch(`${API}/sections`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name})});
  document.getElementById("sectionName").value = "";
  refreshAll();
}

async function addSubject(){
  const name = document.getElementById("subjectName").value.trim();
  const periods_per_week = parseInt(document.getElementById("subjectPeriods").value);
  const teacher_id = parseInt(document.getElementById("subjectTeacher").value);
  const section_id = parseInt(document.getElementById("subjectSection").value);
  if(!name || !teacher_id || !section_id) return;
  await fetch(`${API}/subjects`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, periods_per_week, teacher_id, section_id})
  });
  document.getElementById("subjectName").value = "";
  refreshAll();
}

async function generateTimetable(){
  showMessage("Generating…", "ok");
  const res = await fetch(`${API}/generate`, {method:"POST"});
  const data = await res.json();
  if(!res.ok){
    showMessage("⚠ " + data.detail, "error");
    return;
  }
  showMessage("✓ Timetable generated successfully.", "ok");
  lastTimetable = data.entries;
  const secNames = [...new Set(lastTimetable.map(e => e.section))];
  activeSection = secNames[0];
  renderTabs(secNames);
  renderTimetable();
}

function renderTabs(secNames){
  document.getElementById("sectionTabs").innerHTML = secNames.map(s =>
    `<button class="${s===activeSection?'active':''}" onclick="switchSection('${s}')">${s}</button>`
  ).join("");
}

function switchSection(name){
  activeSection = name;
  renderTabs([...new Set(lastTimetable.map(e => e.section))]);
  renderTimetable();
}

function renderTimetable(){
  const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
  const periods = [1,2,3,4,5,6];
  const rows = lastTimetable.filter(e => e.section === activeSection);

  let html = "<table><tr><th>Period</th>" + days.map(d=>`<th>${d}</th>`).join("") + "</tr>";
  for(const p of periods){
    html += `<tr><td><b>${p}</b></td>`;
    for(const d of days){
      const entry = rows.find(r => r.day === d && r.period === p);
      if(entry){
        html += `<td><div class="cell-subject">${entry.subject}</div>
                  <div class="cell-meta">${entry.teacher}</div>
                  <div class="cell-meta">${entry.room}</div></td>`;
      } else {
        html += `<td></td>`;
      }
    }
    html += "</tr>";
  }
  html += "</table>";
  document.getElementById("timetableView").innerHTML = html;
}

refreshAll();
</script>

</body>
</html>
